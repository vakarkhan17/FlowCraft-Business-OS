services:
  postgres:
    image: postgres:16-alpine
    container_name: flowcraft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowcraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowcraft_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-flowcraft_erp}
    ports:
      - "5432:5432"
    volumes:
      - flowcraft_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowcraft} -d ${POSTGRES_DB:-flowcraft_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-flowcraft}:${POSTGRES_PASSWORD:-flowcraft_dev_password}@postgres:5432/${POSTGRES_DB:-flowcraft_erp}?schema=public
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      PORT: 4000
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"

volumes:
  flowcraft_postgres:
